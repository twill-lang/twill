name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.23", "stable"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build ./...

      - name: Format check
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test with race detector
        # 10m is the go default and the tracer's differential tests run the whole
        # example corpus twice, which the race detector makes several times
        # slower on a shared runner.
        run: go test -race -short -timeout 25m ./internal/tensor/ ./internal/interp/

      - name: Build binary
        run: go build -o twill ./cmd/twill

      - name: Run examples (smoke test)
        run: |
          ./twill examples/hello.tw
          ./twill examples/autodiff.tw
          ./twill examples/linreg.tw
          ./twill examples/nn_xor.tw
          ./twill examples/classifier.tw
          ./twill examples/records.tw
          ./twill examples/einsum.tw
          ./twill examples/montecarlo_option.tw
          ./twill examples/frames.tw
          ./twill examples/units.tw
          ./twill examples/gbm.tw
          ./twill examples/backtest.tw
          ./twill examples/signal_opt.tw
          ./twill examples/cnn.tw
          ./twill examples/save_load.tw
          ./twill examples/minibatch.tw
          ./twill examples/attention.tw
          ./twill examples/jacobian.tw
          ./twill examples/hessian.tw
          ./twill check examples/shapes.tw
          ./twill fmt examples/hello.tw >/dev/null

  # The conformance gate. Twill has two implementations and the README says they
  # agree; this job is what makes that a claim the build can refuse. It is a
  # separate job because the self-hosted side is the Go interpreter interpreting
  # src/*.tw, which is far slower than everything in build-test put together,
  # and because a failure here should be legible on its own.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Build binary
        run: go build -o twill ./cmd/twill

      # docs/conformance.md is generated by probing both implementations, so it
      # cannot drift: if a builtin was added to one side and not the other, or
      # the table changed and nobody regenerated, this step says so.
      - name: Builtin conformance table is current
        run: go run ./tools/conformance builtins -bin ./twill -check

      # Every std/tests suite, run once on the Go bootstrap and once on
      # src/main.tw, compared byte for byte. Known divergences live on
      # testdata/conformance/suite-allow.txt, each line keyed to the divergence
      # it excuses, so a suite that starts failing a different way fails here
      # even though its name is already on the list. Lines may only be removed.
      - name: Standard library suites agree on both implementations
        run: go run ./tools/conformance suites -bin ./twill

      # tools/diff/run, which was in the tree unreferenced by this workflow and
      # by the Makefile since it was written. testdata/conformance/golden-allow.txt
      # holds the findings that had accumulated while nothing was looking, each
      # line keyed to the kind of finding it excuses.
      - name: Fixture corpus matches its recorded goldens
        run: |
          go run ./tools/diff/run -corpus testdata -bin ./twill -verify \
            -allow testdata/conformance/golden-allow.txt

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Dead code
        run: |
          out="$(go run golang.org/x/tools/cmd/deadcode@latest -test ./...)"
          if [ -n "$out" ]; then echo "$out"; echo "::error::dead code found"; exit 1; fi

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
